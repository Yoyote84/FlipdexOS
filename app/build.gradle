plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("FLIPDEX_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("FLIPDEX_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("FLIPDEX_KEY_ALIAS")
def releaseKeyPassword = System.getenv("FLIPDEX_KEY_PASSWORD")
def hasReleaseSigning = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.trim().isEmpty() }
        && file(releaseKeystorePath).isFile()
android {
    namespace "io.github.yoyote84.flipdexos"
    compileSdk 37
    buildToolsVersion "37.0.0"
    defaultConfig {
        applicationId "io.github.yoyote84.flipdexos"
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName "0.1.0-alpha02"
    }
    buildFeatures {
        aidl true
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    // MIT-licensed Shizuku client API.
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
