name: Construire le Flatpak ARM64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak-aarch64:
    name: Compiler le Flatpak pour postmarketOS ARM64
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Construire et publier le bundle de test
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: flipdexos-monitor-aarch64.flatpak
          manifest-path: io.github.yoyote84.flipdexos.yml
          arch: aarch64
          branch: stable
          upload-artifact: true
          artifact-name: flipdexos-monitor-flatpak-aarch64
          verbose: true
