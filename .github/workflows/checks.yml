name: FlipdexOS Monitor checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Vérifier les scripts Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Vérifier la syntaxe Bash
        run: |
          bash -n scripts/flipex-monitor.sh
          bash -n scripts/install-system.sh
          bash -n scripts/install-scrcpy-latest.sh
          bash -n tests/fake-tools.sh

      - name: Analyser les scripts
        run: |
          shellcheck scripts/flipex-monitor.sh
          shellcheck scripts/install-system.sh
          shellcheck scripts/install-scrcpy-latest.sh
          shellcheck tests/fake-tools.sh

      - name: Tester les profils Plasma/KScreen
        run: bash tests/fake-tools.sh

      - name: Vérifier la compatibilité Alpine/postmarketOS
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" alpine:3.24 sh -ec '
            apk add --no-cache bash coreutils grep
            cd /src
            bash -n scripts/flipex-monitor.sh
            bash -n scripts/install-system.sh
            bash -n scripts/install-scrcpy-latest.sh
            bash -n tests/fake-tools.sh
            bash tests/fake-tools.sh
          '

      - name: Vérifier l'aide et les options
        run: |
          bash scripts/flipex-monitor.sh --help
          bash scripts/flipex-monitor.sh --version
          if bash scripts/flipex-monitor.sh --fps 61; then
            echo "Une valeur FPS invalide a été acceptée." >&2
            exit 1
          fi
          if bash scripts/flipex-monitor.sh --display invalide; then
            echo "Une résolution invalide a été acceptée." >&2
            exit 1
          fi
