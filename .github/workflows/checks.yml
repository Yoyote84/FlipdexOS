name: FlipdexOS Monitor checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Vérifier les scripts Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Vérifier la syntaxe Bash
        run: |
          bash -n scripts/flipex-monitor.sh
          bash -n scripts/install-system.sh
          bash -n scripts/install-scrcpy-latest.sh
          bash -n scripts/diagnose-flipex-android.sh
          bash -n scripts/package-release.sh
          bash -n scripts/build-flatpak.sh
          bash -n tests/fake-tools.sh
          bash -n tests/flipex-android-preflight.sh
          bash -n tests/flatpak-packaging.sh
          bash -n tests/android-logic-tests.sh
          sh -n packaging/flatpak/launch.sh
          sh -n packaging/flatpak/host-tool-proxy

      - name: Analyser les scripts
        run: |
          shellcheck scripts/flipex-monitor.sh
          shellcheck scripts/install-system.sh
          shellcheck scripts/install-scrcpy-latest.sh
          shellcheck scripts/diagnose-flipex-android.sh
          shellcheck scripts/package-release.sh
          shellcheck scripts/build-flatpak.sh
          shellcheck packaging/flatpak/launch.sh packaging/flatpak/host-tool-proxy
          shellcheck tests/fake-tools.sh
          shellcheck tests/flipex-android-preflight.sh
          shellcheck tests/flatpak-packaging.sh
          shellcheck tests/android-logic-tests.sh

      - name: Tester les profils Plasma/KScreen
        run: bash tests/fake-tools.sh

      - name: Tester le diagnostic Android FlipEx
        run: bash tests/flipex-android-preflight.sh

      - name: Tester le packaging Flatpak
        run: bash tests/flatpak-packaging.sh

      - name: Tester les règles Android sans dépendance Maven
        run: bash tests/android-logic-tests.sh

      - name: Vérifier la compatibilité Alpine/postmarketOS
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" alpine:3.24 sh -ec '
            apk add --no-cache bash coreutils grep
            cd /src
            bash -n scripts/flipex-monitor.sh
            bash -n scripts/install-system.sh
            bash -n scripts/install-scrcpy-latest.sh
            bash -n scripts/diagnose-flipex-android.sh
            bash -n scripts/package-release.sh
            bash -n scripts/build-flatpak.sh
            bash -n tests/fake-tools.sh
            bash -n tests/flipex-android-preflight.sh
            bash -n tests/flatpak-packaging.sh
            sh -n packaging/flatpak/launch.sh
            sh -n packaging/flatpak/host-tool-proxy
            bash tests/fake-tools.sh
            bash tests/flipex-android-preflight.sh
            bash tests/flatpak-packaging.sh
          '

      - name: Vérifier l'aide et les options
        run: |
          bash scripts/flipex-monitor.sh --help
          bash scripts/flipex-monitor.sh --version
          bash scripts/diagnose-flipex-android.sh --help
          bash scripts/diagnose-flipex-android.sh --version
          if bash scripts/flipex-monitor.sh --fps 61; then
            echo "Une valeur FPS invalide a été acceptée." >&2
            exit 1
          fi
          if bash scripts/flipex-monitor.sh --display invalide; then
            echo "Une résolution invalide a été acceptée." >&2
            exit 1
          fi
