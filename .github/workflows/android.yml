name: Construire l'APK Android FlipdexOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compiler et tester l'APK Z Flip6
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Installer Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer Android 17 Preview (API 37)
        shell: bash
        run: |
          BUILD_TOOLS_PACKAGE="$(sdkmanager --list --channel=3 2>/dev/null \
            | grep -oE 'build-tools;37\.[0-9.]+(-[[:alnum:].-]+)?' \
            | sort -Vu \
            | tail -n 1)"
          if [[ -z "$BUILD_TOOLS_PACKAGE" ]]; then
            echo "Aucune version Android Build-Tools 37 n'est publiée dans le canal Preview." >&2
            exit 1
          fi
          BUILD_TOOLS_VERSION="${BUILD_TOOLS_PACKAGE#build-tools;}"
          echo "Build-Tools sélectionné : $BUILD_TOOLS_VERSION"
          sdkmanager --channel=3 "platforms;android-37" "$BUILD_TOOLS_PACKAGE"
          echo "ANDROID_BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
      - name: Tester les règles d'accès système
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compiler l'APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Vérifier et calculer la somme SHA-256
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum --check app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Publier l'APK debug de test
        uses: actions/upload-artifact@v7
        with:
          name: flipdexos-android-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
