name: Construire l'APK Android FlipdexOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compiler et tester l'APK Z Flip6
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Installer Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer la plateforme Android 17 et Build Tools 37
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # AGP 9.4 resolves compileSdk 37 via the conventional android-37
          # directory; Android's SDK Manager currently installs API 37.0.
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Tester les règles d'accès système sans dépendance externe
        run: bash tests/android-logic-tests.sh

      - name: Compiler l'APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Vérifier et calculer la somme SHA-256
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum --check app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Publier l'APK debug de test
        uses: actions/upload-artifact@v7
        with:
          name: flipdexos-android-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Tester le démarrage sur émulateur Android 16
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: bash tests/android-emulator-smoke.sh
